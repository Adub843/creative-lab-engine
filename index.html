<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Business Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Console sections">
      <a class="logo" href="#home"><span class="logo-mark" aria-hidden="true">BC</span><span>Business Console</span></a>
      <div class="store-seg" id="store-seg" role="group" aria-label="Store"></div>
      <div class="navs" id="navs"></div>
      <button class="nav more" id="more" type="button" aria-expanded="false" aria-controls="navs"><span class="ico" aria-hidden="true">☰</span><span>Menu</span></button>
      <button class="theme" id="theme" type="button" aria-label="Switch light or dark">◐ <span>Theme</span></button>
    </nav>
    <div class="work">
      <header class="topbar">
        <nav class="crumb" id="crumb" aria-label="You are here"></nav>
        <button class="search" id="search" type="button"><span>Search or jump to a tool</span><kbd>/</kbd></button>
        <div class="store-links" id="store-links"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden role="dialog" aria-labelledby="d-title">
    <button class="btn ghost close" id="d-close" type="button">Close</button>
    <span class="eyebrow" id="d-kind"></span>
    <h2 id="d-title"></h2>
    <div class="tags" id="d-tags"></div>
    <div id="d-body" class="stack"></div>
  </aside>

  <dialog class="palette" id="palette" aria-label="Jump to anything">
    <input id="pal-q" type="search" placeholder="Jump to a tool, page, store or site…" autocomplete="off">
    <ul id="pal-list" role="listbox"></ul>
    <p class="hint">Press <kbd>/</kbd> anywhere to open this. <kbd>Enter</kbd> opens the top result.</p>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
