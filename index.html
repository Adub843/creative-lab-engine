<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Business Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="Console sections">
      <a class="logo" href="#dashboard"><span class="logo-mark" aria-hidden="true">BC</span><span>Business Console</span></a>
      <a class="nav" href="#dashboard" data-route="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg><span class="nav-long">Dashboard</span><span class="nav-short" aria-hidden="true">Home</span></a>
      <a class="nav nav-c3d" href="#c3d" data-route="c3d"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span class="nav-long">Charleston 3D</span><span class="nav-short" aria-hidden="true">C3D</span></a>
      <a class="nav nav-ed" href="#ed" data-route="ed"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-1 2-2.3 3-4 3S9 5 8 3z"/></svg><span class="nav-long">Elevated Designs</span><span class="nav-short" aria-hidden="true">ED</span></a>
      <a class="nav" href="#products" data-route="products"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg><span class="nav-long">Products</span><span class="nav-short" aria-hidden="true">Items</span></a>
      <a class="nav" href="#insights" data-route="insights"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="nav-long">Insights</span><span class="nav-short" aria-hidden="true">Sales</span></a>
      <a class="nav" href="#marketing" data-route="marketing"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1zM15 9a3 3 0 010 6M18 6a7 7 0 010 12"/></svg><span class="nav-long">Marketing</span><span class="nav-short" aria-hidden="true">SEO</span></a>
      <a class="nav" href="#promote" data-route="promote"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8l9 9zM7.5 7.5h.01"/></svg><span class="nav-long">Promotions</span><span class="nav-short" aria-hidden="true">Deals</span></a>
      <a class="nav" href="#studio" data-route="studio"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 6l3 3"/></svg><span class="nav-long">Design Studio</span><span class="nav-short" aria-hidden="true">Studio</span></a>
      <a class="nav" href="#map" data-route="map"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7a2 2 0 104 0 2 2 0 00-4 0zM15 17a2 2 0 104 0 2 2 0 00-4 0zM9 7h4a3 3 0 010 6h-2a3 3 0 000 6h4"/></svg><span class="nav-long">Service Map</span><span class="nav-short" aria-hidden="true">Map</span></a>
      <button class="theme" id="theme" type="button" aria-label="Switch light or dark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 3a9 9 0 000 18V3z"/><circle cx="12" cy="12" r="9"/></svg><span>Theme</span></button>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden role="dialog" aria-labelledby="d-title">
    <button class="btn ghost close" id="d-close" type="button">Close</button>
    <span class="eyebrow" id="d-kind"></span>
    <h2 id="d-title"></h2>
    <div class="tags" id="d-tags"></div>
    <div id="d-body" class="stack"></div>
  </aside>

  <dialog class="palette" id="palette" aria-label="Jump to anything">
    <input id="pal-q" type="search" placeholder="Jump to a page, store or site…" autocomplete="off">
    <ul id="pal-list" role="listbox"></ul>
    <p class="hint">Press <kbd>/</kbd> anywhere to open this. <kbd>Enter</kbd> opens the top result.</p>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
