<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
	<!-- miniPaint 4.14.3 (MIT, github.com/viliusle/miniPaint), the Lab's Photo editor engine. Loaded inside ../photo.html. -->
	<meta charset="utf-8" />
	<title>Photo editor · Lab</title>
	<meta name="robots" content="noindex,nofollow" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
	<script>try{var t=(parent.parent&&parent.parent.document.documentElement.dataset.theme)==="light"?"light":"dark";var c={};try{var m=document.cookie.match(/(?:^|; )config=([^;]*)/);if(m)c=JSON.parse(m[1])}catch(e){}c.theme=t;c.exit_confirm=false;document.cookie="config="+JSON.stringify(c)+";path=/;SameSite=None;Secure"}catch(e){}</script>
	<script src="dist/bundle.js"></script>
	<style>
	/* the Lab bar above already names the file, so the miniPaint word mark is hidden */
	.submenu .logo{display:none!important}
	/* Graphite + Gold, the Lab's own palette (default dark theme) */
	html body.theme-dark{
		--background:#15181c;--section-background-color:#23272d;--area-background-color:#2c3138;--block-background-color:#2c3138;
		--header-background-color:#23272d;--button-background-color:#23272d;--button-background-color-hover:#c9a24a;--button-background-color-active:#394048;
		--button-text-color-active:#e2c47e;--button-toggle-background-color:#394048;--button-toggle-background-color-hover:#394048;
		--input-background-color:#1b1e23;--input-background-color-hover:#23272d;--input-border-color:#394048;--input-border-color-active:#c9a24a;--input-group-border-color:#30353c;
		--menu-background-color:#1b1e23;--menu-text-color:#d7dade;--background-color-active:#c9a24a;--background-color-hover:#394048;--text-color-active:#1b1e23;
		--text-color:#f1f2f4;--text-color-muted:#a7adb7;--text-color-green:#4fbf86;--link-color:#d8b45e;--border-color:#394048;
		--scrollbar-track-color:#23272d;--scrollbar-thumb-color:#394048;
		font-family:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif}
	/* light mode in the Lab: soft grey with brass, not the stock blue */
	html body.theme-light{--background:#d7dbe0;--button-text-color-active:#8c6f2b;--input-border-color-active:#8c6f2b;--menu-dropdown-hover-background-color:#e9dcc0;--menu-dropdown-border-color:#8c6f2b;--background-color-active:#e9dcc0;--text-color-active:#5a4518;--link-color:#8c6f2b}
	</style>
</head>
<body>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>
		
		<div class="submenu">
			<a class="logo" href="#">miniPaint</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>
		
		<div class="sidebar_left" id="tools_container"></div>


		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right">
			<div class="preview block">
				<h2 class="trn toggle" data-target="toggle_preview">Preview</h2>
				<div id="toggle_preview"></div>
			</div>
			
			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>
			
			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info">Information</h2>
				<div class="content" id="toggle_info"></div>
			</div>
			
			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details">Layer details</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>
			
			<div class="layers block">
				<h2 class="trn">Layers</h2>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
</body>
</html>
