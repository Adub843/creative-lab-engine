<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Steve</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steve">
<meta name="theme-color" content="#15223f">
<style>
:root{--navy:#15223f;--ink:#1f2638;--muted:#4d5568;--cream:#f7f2e8;--paper:#fffdf8;--line:#e2d9c6;--gold:#b8892a;--btn:#8c6f2b;--rec:#a8322b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--navy);color:var(--cream)}
header .mark{width:42px;height:42px;border-radius:50%;flex:none;background:var(--cream);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:19px;border:2px solid var(--gold)}
header .mark.talking{box-shadow:0 0 0 4px rgba(184,137,42,.55)}
header b{display:block;font-size:17px;font-weight:600;letter-spacing:.01em}
header small{display:block;color:#c9cfdd;font-size:13px}
.hb{margin-left:auto;display:flex;gap:8px}
.hb button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #47557a;color:var(--cream);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.hb button[aria-pressed=true]{background:var(--btn);border-color:var(--btn)}
.hb svg{width:15px;height:15px}
#log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;max-width:780px;width:100%;margin:0 auto}
.m{max-width:84%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.u{background:var(--navy);color:var(--cream);align-self:flex-end}
.t{color:var(--muted);font-style:italic}
.e{color:var(--rec);align-self:center;font-size:14px}
.bar{padding:12px 16px;background:var(--paper);border-top:1px solid var(--line)}
.bar .in{display:flex;gap:8px;max-width:780px;margin:0 auto;align-items:flex-end}
textarea{flex:1;resize:none;min-height:46px;max-height:150px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.bar button{border:0;border-radius:10px;min-width:50px;height:46px;font:inherit;font-weight:600;color:#fff;cursor:pointer;display:grid;place-items:center}
#mic{background:var(--navy)}
#mic svg{width:20px;height:20px}
#mic.on{background:var(--rec)}
#go{background:var(--btn);padding:0 18px}
button:disabled{opacity:.5;cursor:default}
.note{max-width:780px;margin:6px auto 0;font-size:12px;color:var(--muted)}
@media (max-width:560px){header{padding:10px 12px;gap:10px}header small{font-size:12px}.hb button{padding:7px 8px}#clear{display:none}.m{max-width:92%}}
</style>
</head>
<body>
<header><div class="mark" id="av" aria-hidden="true">S</div><div><b>Steve</b><small id="sub">Business agent for Elevated Designs and Charleston3D</small></div>
<div class="hb"><button id="voice" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="voiceLabel">Voice off</span></button><button id="clear" type="button">New chat</button></div></header>
<div id="log" aria-live="polite"></div>
<div class="bar"><form class="in" id="f"><button id="mic" type="button" aria-label="Talk to Steve"><svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button><textarea id="q" rows="1" placeholder="Message Steve" aria-label="Message Steve"></textarea><button id="go">Send</button></form>
<p class="note">Steve drafts and answers. Publishing, spending and customer messages still need your OK.</p></div>
<script>
const $=id=>document.getElementById(id);
const log=$('log'),q=$('q'),go=$('go'),mic=$('mic'),vbtn=$('voice'),av=$('av'),sub=$('sub');
const KEY='steve-chat',SUB=matchMedia('(max-width:560px)').matches?'Business agent':'Business agent for Elevated Designs and Charleston3D';sub.textContent=SUB;
const MIC='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',STOP='<rect x="6" y="6" width="12" height="12" rx="2"/>';
function fresh(){return {session:Math.random().toString(36).slice(2,12)+Date.now().toString(36),msgs:[],voice:false}}
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!st||!st.session)st=fresh();
function save(){try{st.msgs=st.msgs.slice(-80);localStorage.setItem(KEY,JSON.stringify(st))}catch{}}
function add(m){const d=document.createElement('div');d.className='m '+(m.r==='u'?'u':m.r==='e'?'e':m.r==='t'?'a t':'a');d.textContent=m.t;log.append(d);log.scrollTop=log.scrollHeight;return d}
function paint(){log.textContent='';if(!st.msgs.length)add({r:'a',t:"Hi Aaron, it's Steve. Ask me about either shop, or tell me what to draft: a listing, a post, a quote reply."});st.msgs.forEach(add)}
paint();
/* spoken replies */
function paintVoice(){vbtn.setAttribute('aria-pressed',st.voice?'true':'false');$('voiceLabel').textContent=st.voice?'Voice on':'Voice off'}
paintVoice();
let VOICE=null;function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));VOICE=vs.find(v=>/david|guy|male|daniel|google uk english male|alex/i.test(v.name))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else{vbtn.hidden=true}
function speak(t){if(!st.voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[*_#`>]/g,'').slice(0,1200));if(VOICE)u.voice=VOICE;u.onstart=()=>av.classList.add('talking');u.onend=u.onerror=()=>av.classList.remove('talking');speechSynthesis.speak(u)}
vbtn.onclick=()=>{st.voice=!st.voice;save();paintVoice();if(st.voice){speak('Voice is on.')}else if('speechSynthesis' in window)speechSynthesis.cancel()};
$('clear').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();const v=st.voice;st=fresh();st.voice=v;save();paint()};
/* talking */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,base='',autoSend=false,spoken=false;
function micIcon(on){$('micIcon').innerHTML=on?STOP:MIC;mic.classList.toggle('on',on);mic.setAttribute('aria-label',on?'Stop and send':'Talk to Steve')}
if(!SR){mic.onclick=()=>{q.focus();sub.textContent='Use the microphone key on your keyboard to talk.'}}
else mic.onclick=()=>{if(listening){autoSend=true;rec.stop();return}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;base=q.value.trim()?q.value.trim()+' ':'';autoSend=false;
  rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;q.value=base+s;grow()};
  rec.onerror=e=>{sub.textContent=e.error==='not-allowed'?'Microphone blocked: allow it for this page.':'Microphone: '+e.error};
  rec.onend=()=>{listening=false;micIcon(false);if(autoSend&&q.value.trim()){spoken=true;$('f').requestSubmit()}};
  try{rec.start();listening=true;micIcon(true);sub.textContent='Listening. Press the button again to send.'}catch(err){sub.textContent='Microphone: '+err.message}};
function grow(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,150)+'px'}
q.addEventListener('input',grow);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi/i.test(navigator.userAgent)){e.preventDefault();$('f').requestSubmit()}});
$('f').onsubmit=async e=>{e.preventDefault();if(listening){autoSend=false;rec.stop()}
  const text=q.value.trim();if(!text||go.disabled)return;const wasSpoken=spoken;spoken=false;
  q.value='';grow();const um={r:'u',t:text};st.msgs.push(um);save();add(um);
  const wait=add({r:'t',t:'Steve is working on it'});go.disabled=true;sub.textContent=SUB;
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session:st.session,spoken:wasSpoken||st.voice})});
    const j=await r.json();wait.remove();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    const m={r:'a',t:j.reply};st.msgs.push(m);save();add(m);speak(j.reply);
  }catch(err){wait.remove();add({r:'e',t:"That did not go through: "+err.message});q.value=text;grow()}
  go.disabled=false};
</script>
</body>
</html>
