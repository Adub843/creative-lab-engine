<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maker · Charleston3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>try{var t=parent.document.documentElement.dataset.theme||localStorage.getItem("bc-theme");if(t)document.documentElement.dataset.theme=String(t).replace(/"/g,"")}catch(e){}</script>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--raise:#ece5d6;--line:#ddd3bf;--fg:#16203a;--muted:#5e6474;--accent:#0e7c74;--accent-fg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#111d36;--raise:#182644;--line:#24345a;--fg:#f3ede1;--muted:#aab3c7;--accent:#4fc8bd;--accent-fg:#06201d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;padding:16px}
[hidden]{display:none!important}.small{font-size:13px}.muted{color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbwrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start;max-width:1200px;margin:0 auto}
.lbmodes{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lbmodes button{font:inherit;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer;display:grid;gap:2px}
.lbmodes button b{font-size:14px}.lbmodes button span{font-size:12.5px;color:var(--muted);line-height:1.3}
.lbmodes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lbside{display:grid;gap:14px}
.lbdrop{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;cursor:pointer;min-height:120px;display:grid;place-items:center;gap:10px;background:var(--card)}
.lbdrop.over{border-color:var(--accent)}.lbdrop-in{display:grid;gap:4px;justify-items:center}
.lbdrop-ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.6}
.lbthumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.lbthumb{position:relative;display:inline-block}
.lbthumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.lbrm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#222;color:#fff;cursor:pointer;line-height:1}
.lbopts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.lbgrid label,.lbname{display:block;font-size:12.5px;color:var(--muted)}.lbgrid label.wide{grid-column:1/-1}.lbgrid .u{font-size:11px;opacity:.75}
.lbgrid input[type=number],.lbgrid input[type=text],.lbgrid select,.lbname input{display:block;margin-top:4px;width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.lbgrid label.chk{display:flex;align-items:center;gap:8px;align-self:end;padding-bottom:8px;color:var(--fg)}
.lbgrid input[type=range]{display:block;margin-top:6px}
.lbgrid input[type=range]{width:100%;accent-color:var(--accent)}.lbname{margin-top:12px}
.lbprev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:16px}
.lbprev-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbprev figure{margin:0;display:grid;gap:6px;justify-items:center}
.lbprev canvas{max-width:100%;max-height:340px;width:auto;height:auto;border-radius:8px;background:#111;border:1px solid var(--line)}
.lbprev figcaption{font-size:12px;color:var(--muted)}
.lbprev figure:has(canvas[width="10"]){display:none}
.lbpal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lbpal .sw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.lbpal .sw i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.lbstat{margin-top:10px}.lbacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}#lbDl{display:contents}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:9}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px}
@media (max-width:820px){.lbwrap{grid-template-columns:1fr}.lbmodes{grid-template-columns:1fr 1fr}.lbprev{position:static}}
</style>
</head>
<body>
<div id="lbMount"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON={image:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>'};
function toast(msg){let box=document.getElementById("toasts");if(!box){box=document.createElement("div");box.id="toasts";box.className="toasts";box.setAttribute("role","status");document.body.appendChild(box);}const t=document.createElement("div");t.className="toast";t.textContent=msg;box.appendChild(t);setTimeout(()=>t.remove(),3500);}
function dlBlob(name,blob){name=String(name||"file").replace(/[\\/:*?"<>|]+/g,"-");const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;}
</script>
<script>
/* ================= MAKER: Light box · Keychain · Sign · Lithophane — picture in, Bambu-ready 3MF/STL out ================= */
const MK_MODES=[["lightbox","Light box","Picture-shaped front with a thick border wall, a box behind it and a snap-on lid. LED puck inside."],["keychain","Keychain","Picture traced into a flat multi-colour tag with a ring hole."],["sign","Sign","Raised lettering on a plate. Name plates, badges, shelf signs."],["litho","Lithophane","Photo as a thin grey plate that shows the picture when lit from behind."]];
const MK_SHAPES=[["trace","Trace the picture"],["rect","Square / rectangle"],["round","Rounded"],["circle","Circle"]];
const MK_FONTS=["Impact","Arial Black","Georgia","Trebuchet MS","Courier New","Brush Script MT","Comic Sans MS","Verdana"];
const MK={mode:"lightbox", imgs:[], shape:"trace", width:120, height:0, lock:true, res:0.4, colors:4, border:4, gap:0, depth:50, wallT:3, lid:true, hole:false, imgT:0.6, backT:1.0, keyT:3, ring:true, text:"", font:"Impact", textT:1, plateT:3, name:"",
  minT:0.8, maxT:3.0, lres:0.3, arc:0, invert:false, bright:0, contrast:0, blur:0.6, mirror:false,
  busy:false, parts:[], palette:[], node:null, dirty:true, keyTol:40, bg:"auto"};
const LB=MK; /* legacy alias */

function mkRound(n,d){ return Math.round(n*(d||10))/(d||10); }
function mkTitle(){ return ({lightbox:"Light box",keychain:"Keychain",sign:"Sign",litho:"Lithophane"})[MK.mode]||"Maker"; }
/* ---- page ---- */
function lbMount(){ const m=document.getElementById("lbMount"); if(!m) return; MK.node=m;
  m.innerHTML=`<div class="lbwrap">
    <div class="lbmodes" id="mkModes">${MK_MODES.map(x=>`<button type="button" data-mode="${x[0]}" aria-pressed="${MK.mode===x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join("")}</div>
    <div class="lbdrop mk-img" id="lbDrop" tabindex="0" role="button" aria-label="Drop a picture here or tap to choose">
      <input type="file" id="lbFile" accept="image/*" multiple hidden>
      <div class="lbdrop-in"><span class="lbdrop-ic">${ICON.image}</span><strong>Drop a picture here</strong><span class="small muted">or tap to choose · paste works too · PNG with a see-through background traces best</span></div>
      <div class="lbthumbs" id="lbThumbs"></div></div>
    <div class="lbopts">
      <div class="lbgrid">
        <label class="mk-sign wide">Text<input type="text" id="mkText" maxlength="40" placeholder="e.g. THE LEWIS FAMILY" value="${esc(MK.text)}"></label>
        <label class="mk-sign">Font<select id="mkFont">${MK_FONTS.map(f=>`<option ${MK.font===f?"selected":""}>${f}</option>`).join("")}</select></label>
        <label class="mk-sign">Letter height <span class="u">mm</span><input type="number" id="mkTextT" min="0.4" max="4" step="0.2" value="${MK.textT}"></label>
        <label class="mk-sign">Plate thickness <span class="u">mm</span><input type="number" id="mkPlateT" min="2" max="8" step="0.5" value="${MK.plateT}"></label>
        <label class="mk-shape">Shape<select id="mkShape">${MK_SHAPES.map(s=>`<option value="${s[0]}" ${MK.shape===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select></label>
        <label>Width <span class="u">mm</span><input type="number" id="lbW" min="20" max="250" step="1" value="${MK.width}"></label>
        <label>Height <span class="u">mm</span><input type="number" id="lbH" min="20" max="250" step="1" value="${MK.height||""}" placeholder="auto"></label>
        <label class="chk"><input type="checkbox" id="lbLock" ${MK.lock?"checked":""}> Keep picture shape</label>
        <label class="mk-color">Colours<select id="mkColors">${[2,3,4,5,6,8].map(n=>`<option ${MK.colors===n?"selected":""}>${n}</option>`).join("")}</select></label>
        <label class="mk-color">Detail <span class="u">mm</span><select id="mkRes"><option value="0.6" ${MK.res===0.6?"selected":""}>Fast · 0.6</option><option value="0.4" ${MK.res===0.4?"selected":""}>Normal · 0.4</option><option value="0.3" ${MK.res===0.3?"selected":""}>Fine · 0.3</option></select></label>
        <label class="mk-lightbox mk-keychain">Border <span class="u">mm</span><input type="number" id="mkBorder" min="1" max="15" step="0.5" value="${MK.border}"></label>
        <label class="mk-lightbox mk-keychain">Space between picture &amp; border <span class="u">mm</span><input type="number" id="mkGap" min="0" max="20" step="0.5" value="${MK.gap}"></label>
        <label class="mk-lightbox">Box depth <span class="u">mm</span><input type="number" id="mkDepth" min="15" max="120" step="1" value="${MK.depth}"></label>
        <label class="mk-lightbox">Wall <span class="u">mm</span><input type="number" id="mkWallT" min="1.6" max="6" step="0.2" value="${MK.wallT}"></label>
        <label class="mk-lightbox chk"><input type="checkbox" id="mkLid" ${MK.lid?"checked":""}> Snap-on lid</label>
        <label class="mk-lightbox chk"><input type="checkbox" id="mkHole" ${MK.hole?"checked":""}> Cable hole in lid</label>
        <label class="mk-keychain">Thickness <span class="u">mm</span><input type="number" id="mkKeyT" min="2" max="6" step="0.5" value="${MK.keyT}"></label>
        <label class="mk-keychain chk"><input type="checkbox" id="mkRing" ${MK.ring?"checked":""}> Ring hole tab</label>
        <label class="mk-litho">Thinnest <span class="u">mm</span><input type="number" id="lbMin" min="0.4" max="2" step="0.1" value="${MK.minT}"></label>
        <label class="mk-litho">Thickest <span class="u">mm</span><input type="number" id="lbMax" min="1.5" max="6" step="0.1" value="${MK.maxT}"></label>
        <label class="mk-litho">Detail <span class="u">mm</span><select id="lbRes"><option value="0.4" ${MK.lres===0.4?"selected":""}>Fast · 0.4</option><option value="0.3" ${MK.lres===0.3?"selected":""}>Normal · 0.3</option><option value="0.2" ${MK.lres===0.2?"selected":""}>Fine · 0.2</option></select></label>
        <label class="mk-litho">Curve <span class="u">° (0 = flat)</span><input type="number" id="lbArc" min="0" max="180" step="10" value="${MK.arc}"></label>
        <label class="mk-litho chk"><input type="checkbox" id="lbInvert" ${MK.invert?"checked":""}> Negative</label>
        <label class="mk-img">Brightness<input type="range" id="lbBright" min="-60" max="60" step="5" value="${MK.bright}"></label>
        <label class="mk-img">Contrast<input type="range" id="lbContrast" min="-60" max="60" step="5" value="${MK.contrast}"></label>
        <label class="mk-litho">Smooth<input type="range" id="lbBlur" min="0" max="2" step="0.2" value="${MK.blur}"></label>
      </div>
      <label class="lbname">Name<input type="text" id="lbName" maxlength="80" placeholder="e.g. Grandma's cat light box" value="${esc(MK.name)}"></label>
    </div>
    <div class="lbprev"><div class="lbprev-row"><figure><canvas id="lbLit" width="10" height="10"></canvas><figcaption id="lbCap1">Front</figcaption></figure><figure><canvas id="lbRelief" width="10" height="10"></canvas><figcaption id="lbCap2">Parts</figcaption></figure></div>
      <div class="lbpal" id="lbPal"></div>
      <div class="lbstat small muted" id="lbStat">Add a picture to start.</div>
      <div class="lbacts"><button type="button" class="btn primary" id="lbBuild">Build print file</button><span id="lbDl"></span></div></div>
  </div>`;
  const drop=m.querySelector("#lbDrop"), file=m.querySelector("#lbFile");
  drop.onclick=e=>{ if(e.target.closest("[data-lbrm]")) return; file.click(); }; drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); file.click(); } };
  file.onchange=()=>{ lbAddFiles(file.files); file.value=""; };
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("over"); })); ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop",e=>lbAddFiles(e.dataTransfer&&e.dataTransfer.files));
  if(!MK.pasteBound){ MK.pasteBound=true; document.addEventListener("paste",e=>{ if(!MK.node||!document.body.contains(MK.node)) return; const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>/^image\//.test(f.type)); if(fs.length){ e.preventDefault(); lbAddFiles(fs); } }); }
  m.querySelector("#mkModes").onclick=e=>{ const b=e.target.closest("[data-mode]"); if(!b) return; MK.mode=b.dataset.mode; m.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b)); mkShowOpts(); lbPreview(); };
  const num=(id,k,min,max)=>{ const i=m.querySelector(id); if(!i) return; i.oninput=()=>{ const v=parseFloat(i.value); if(!isFinite(v)){ if(k==="height") MK.height=0; lbPreview(); return; } MK[k]=Math.min(max,Math.max(min,v)); if(k==="height"&&MK.lock){ MK.lock=false; m.querySelector("#lbLock").checked=false; } lbPreview(); }; };
  num("#lbW","width",20,250); num("#lbH","height",20,250); num("#lbMin","minT",0.4,2); num("#lbMax","maxT",1.5,6); num("#lbArc","arc",0,180); num("#mkBorder","border",1,15); num("#mkGap","gap",0,20); num("#mkDepth","depth",15,120); num("#mkWallT","wallT",1.6,6); num("#mkKeyT","keyT",2,6); num("#mkTextT","textT",0.4,4); num("#mkPlateT","plateT",2,8);
  num("#lbBright","bright",-60,60); num("#lbContrast","contrast",-60,60); num("#lbBlur","blur",0,2);
  const sel=(id,k,f)=>{ const i=m.querySelector(id); if(i) i.onchange=e=>{ MK[k]=f?f(e.target.value):e.target.value; lbPreview(); }; };
  sel("#lbRes","lres",parseFloat); sel("#mkRes","res",parseFloat); sel("#mkColors","colors",v=>parseInt(v,10)); sel("#mkShape","shape"); sel("#mkFont","font");
  const chk=(id,k)=>{ const i=m.querySelector(id); if(i) i.onchange=e=>{ MK[k]=e.target.checked; if(k==="lock"&&MK.lock) MK.height=0; lbPreview(); }; };
  chk("#lbLock","lock"); chk("#lbInvert","invert"); chk("#mkLid","lid"); chk("#mkHole","hole"); chk("#mkRing","ring");
  m.querySelector("#mkText").oninput=e=>{ MK.text=e.target.value; lbPreview(); };
  m.querySelector("#lbName").oninput=e=>{ MK.name=e.target.value; };
  m.querySelector("#lbBuild").onclick=lbBuild;
  mkShowOpts(); lbPaintThumbs(); lbPreview();
}
function mkShowOpts(){ const m=MK.node; if(!m) return; const md=MK.mode;
  m.querySelectorAll(".mk-lightbox,.mk-keychain,.mk-sign,.mk-litho,.mk-color,.mk-shape,.mk-img").forEach(x=>{ const on=(x.classList.contains("mk-"+md))||(x.classList.contains("mk-color")&&md!=="litho"&&md!=="sign")||(x.classList.contains("mk-shape")&&(md==="lightbox"||md==="keychain"))||(x.classList.contains("mk-img")&&md!=="sign"); x.hidden=!on; });
  const lock=m.querySelector("#lbLock"); if(lock) lock.closest("label").hidden=md==="sign";
  const c1=m.querySelector("#lbCap1"), c2=m.querySelector("#lbCap2"); if(c1) c1.textContent=md==="litho"?"Lit (what the customer sees)":"Front"; if(c2) c2.textContent=md==="litho"?"Unlit relief":(md==="lightbox"?"Box + lid":"Parts"); }
function lbAddFiles(files){ const fs=[...(files||[])].filter(f=>/^image\//.test(f.type)); if(!fs.length){ toast("That isn't a picture."); return; }
  fs.slice(0,1).forEach(f=>{ const url=URL.createObjectURL(f); const im=new Image(); im.onload=()=>{ MK.imgs.forEach(x=>URL.revokeObjectURL(x.url)); MK.imgs=[{file:f,url,img:im,w:im.naturalWidth,h:im.naturalHeight}]; if(!MK.name){ MK.name=(f.name||"photo").replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").slice(0,60); const n=MK.node&&MK.node.querySelector("#lbName"); if(n&&!n.value) n.value=MK.name; } lbPaintThumbs(); lbPreview(); }; im.onerror=()=>{ URL.revokeObjectURL(url); toast("Couldn't read that picture."); }; im.src=url; }); }
function lbPaintThumbs(){ const t=MK.node&&MK.node.querySelector("#lbThumbs"); if(!t) return; t.innerHTML=MK.imgs.map((x,i)=>`<span class="lbthumb"><img src="${x.url}" alt="Picture"><button type="button" class="lbrm" data-lbrm="${i}" aria-label="Remove picture">×</button></span>`).join("");
  t.querySelectorAll("[data-lbrm]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const x=MK.imgs.splice(+b.dataset.lbrm,1)[0]; if(x) URL.revokeObjectURL(x.url); lbPaintThumbs(); lbPreview(); });
  MK.node.querySelector("#lbDrop").classList.toggle("has",MK.imgs.length>0); }
/* ---- source picture: photo, or text rendered to a canvas (sign) ---- */
function mkSource(){ if(MK.mode==="sign"){ const t=(MK.text||"").trim()||"YOUR TEXT"; const cv=document.createElement("canvas"); const ctx=cv.getContext("2d"); const fs=200; ctx.font=`bold ${fs}px "${MK.font}"`; const tw=Math.ceil(ctx.measureText(t).width)+fs*0.6; cv.width=Math.max(300,tw); cv.height=Math.round(fs*1.5); ctx.font=`bold ${fs}px "${MK.font}"`; ctx.textBaseline="middle"; ctx.textAlign="center"; ctx.fillStyle="#000"; ctx.fillText(t,cv.width/2,cv.height/2+fs*0.05); return {img:cv,w:cv.width,h:cv.height,alpha:true}; }
  const im=MK.imgs[0]; return im?{img:im.img,w:im.w,h:im.h,alpha:false}:null; }
function lbDims(){ const src=mkSource(); const w=MK.width; let h=MK.height; if(!h||MK.lock||MK.mode==="sign") h=src?Math.round(w*src.h/src.w):Math.round(w*0.75); h=Math.min(250,Math.max(10,h)); return {w,h}; }
/* sample the picture into a cols×rows grid: rgba per cell */
function mkSample(src,cols,rows,filters){ const cv=document.createElement("canvas"); cv.width=cols; cv.height=rows; const ctx=cv.getContext("2d",{willReadFrequently:true}); const sc=Math.max(cols/src.w,rows/src.h), dw=src.w*sc, dh=src.h*sc;
  const f=[]; if(filters){ if(MK.blur>0&&MK.mode==="litho") f.push(`blur(${(MK.blur*0.6).toFixed(2)}px)`); if(MK.bright) f.push(`brightness(${(1+MK.bright/100).toFixed(2)})`); if(MK.contrast) f.push(`contrast(${(1+MK.contrast/100).toFixed(2)})`); } try{ ctx.filter=f.join(" ")||"none"; }catch{}
  ctx.drawImage(src.img,(cols-dw)/2,(rows-dh)/2,dw,dh); ctx.filter="none"; return ctx.getImageData(0,0,cols,rows).data; }
/* ---- masks (Uint8Array cols*rows) ---- */
function mkShapeMask(d,cols,rows){ const m=new Uint8Array(cols*rows); const n=cols*rows;
  if(MK.shape==="trace"||MK.mode==="sign"){ let hasAlpha=false; for(let i=0;i<n;i++) if(d[i*4+3]<128){ hasAlpha=true; break; }
    if(hasAlpha){ for(let i=0;i<n;i++) m[i]=d[i*4+3]>=128?1:0; }
    else { /* key out the background colour sampled from the corners */ const cs=[0,cols-1,(rows-1)*cols,rows*cols-1].map(i=>[d[i*4],d[i*4+1],d[i*4+2]]); const bg=cs.reduce((a,c)=>[a[0]+c[0]/4,a[1]+c[1]/4,a[2]+c[2]/4],[0,0,0]); const tol=MK.keyTol*MK.keyTol*3;
      for(let i=0;i<n;i++){ const dr=d[i*4]-bg[0],dg=d[i*4+1]-bg[1],db=d[i*4+2]-bg[2]; m[i]=(dr*dr+dg*dg+db*db)>tol?1:0; }
      /* only cells reachable from the edge through background count as outside */ const out=mkFlood(m,cols,rows); for(let i=0;i<n;i++) m[i]=out[i]?0:1; }

  return {verts:V,tris:T,name:part.name,color:part.color}; }
function mkTriArray(mesh){ const o=new Float32Array(mesh.tris.length*3); for(let i=0;i<mesh.tris.length;i++){ const v=mesh.tris[i]*3; o[i*3]=mesh.verts[v]; o[i*3+1]=mesh.verts[v+1]; o[i*3+2]=mesh.verts[v+2]; } return o; }
function lbSTL(tri,name){ const n=tri.length/9; const buf=new ArrayBuffer(84+n*50); const dv=new DataView(buf); const hdr=("Charleston 3D maker "+(name||"")).slice(0,79); for(let i=0;i<hdr.length;i++) dv.setUint8(i,hdr.charCodeAt(i)&127); dv.setUint32(80,n,true); let o=84;
  for(let t=0;t<n;t++){ const i=t*9; const ux=tri[i+3]-tri[i],uy=tri[i+4]-tri[i+1],uz=tri[i+5]-tri[i+2],vx=tri[i+6]-tri[i],vy=tri[i+7]-tri[i+1],vz=tri[i+8]-tri[i+2]; const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1; dv.setFloat32(o,nx/l,true); dv.setFloat32(o+4,ny/l,true); dv.setFloat32(o+8,nz/l,true); o+=12; for(let k=0;k<9;k++){ dv.setFloat32(o,tri[i+k],true); o+=4; } dv.setUint16(o,0,true); o+=2; }
  return new Blob([buf],{type:"model/stl"}); }
/* ---- 3MF (zip, stored) with one object per part, named by colour ---- */
const MK_CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function mkCrc(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=MK_CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function mkZip(files){ const enc=new TextEncoder(); const parts=[], cd=[]; let off=0; const le16=v=>[v&255,(v>>8)&255], le32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){ const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data; const crc=mkCrc(data); const hdr=new Uint8Array([0x50,0x4b,3,4,...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...name]); parts.push(hdr,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...le16(20),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off),...name])); off+=hdr.length+data.length; }
  const cdLen=cd.reduce((s,a)=>s+a.length,0); const end=new Uint8Array([0x50,0x4b,5,6,...le16(0),...le16(0),...le16(files.length),...le16(files.length),...le32(cdLen),...le32(off),...le16(0)]); return new Blob([...parts,...cd,end],{type:"model/3mf"}); }
function mk3MF(meshes,title){ const esc1=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); let objs="", items="";
  meshes.forEach((m,i)=>{ const id=i+1; const v=[]; for(let k=0;k<m.verts.length;k+=3) v.push(`<vertex x="${m.verts[k].toFixed(3)}" y="${m.verts[k+1].toFixed(3)}" z="${m.verts[k+2].toFixed(3)}"/>`); const t=[]; for(let k=0;k<m.tris.length;k+=3) t.push(`<triangle v1="${m.tris[k]}" v2="${m.tris[k+1]}" v3="${m.tris[k+2]}"/>`);
    objs+=`<object id="${id}" name="${esc1(m.name)}" type="model"><mesh><vertices>${v.join("")}</vertices><triangles>${t.join("")}</triangles></mesh></object>`; items+=`<item objectid="${id}"/>`; });
  const model=`<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Title">${esc1(title)}</metadata><metadata name="Application">Charleston 3D Maker</metadata><resources>${objs}</resources><build>${items}</build></model>`;
  return mkZip([{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`},{name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`},{name:"3D/3dmodel.model",data:model}]); }
function lbSlug(s){ return String(s||"maker").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"maker"; }
async function lbBuild(){ if(MK.busy) return; if(MK.mode!=="sign"&&!MK.imgs.length){ toast("Add a picture first."); return; }
  MK.busy=true; const m=MK.node, st=m.querySelector("#lbStat"), btn=m.querySelector("#lbBuild"); btn.disabled=true; st.textContent="Building the print file…"; await new Promise(r=>setTimeout(r,30));
  try{ const name=MK.name||mkTitle(); const slug=lbSlug(name); const parts=[]; MK.meta={};
    if(MK.mode==="litho"){ const src=mkSource(); const {w,h}=lbDims(); const cell=MK.lres; const cols=Math.round(w/cell)+1, rows=Math.round(h/cell)+1; const T=lbThick(lbGrey(src,cols,rows)); let tri=lbGridSolid(cols,rows,cell,(c,r)=>T[(rows-1-r)*cols+c]); if(MK.arc>0) tri=lbBend(tri,(cols-1)*cell,MK.arc); tri=lbStandUp(tri); parts.push({name:slug+"-lithophane.stl",blob:lbSTL(tri,name)}); MK.meta={w,h}; }
    else { const L=mkLayout(); if(!L) throw new Error("no source"); const front=L.parts.filter(p=>!p.lid).map(p=>mkMesh(p,L)); const lid=L.parts.filter(p=>p.lid).map(p=>mkMesh(p,L));
      parts.push({name:slug+".3mf",blob:mk3MF(front,name),label:"3MF for Bambu Studio"}); if(lid.length) parts.push({name:slug+"-lid.3mf",blob:mk3MF(lid,name+" lid"),label:"Lid 3MF"});
      parts.push({name:slug+"-all-parts.stl",blob:lbSTL(mkTriArray({verts:front.flatMap(x=>x.verts),tris:front.reduce((acc,x)=>{ const b=acc.off; x.tris.forEach(t=>acc.t.push(t+b)); acc.off+=x.verts.length/3; return acc; },{t:[],off:0}).t}),name),label:"STL (one colour)"});
      MK.meta={w:mkRound(L.cols*L.res),h:mkRound(L.rows*L.res),palette:L.palette.map(mkHex),parts:L.parts.length}; }
    MK.parts=parts; MK.dirty=false; const tot=parts.reduce((s,p)=>s+p.blob.size,0);
    st.textContent=MK.mode==="litho"?`Ready · ${(tot/1048576).toFixed(1)} MB · Bambu Studio: white PLA, 0.12 mm layers, 100% infill, print standing.`:`Ready · ${(tot/1048576).toFixed(1)} MB · Open the 3MF in Bambu Studio, say Yes to "load as one object with multiple parts", then pick a filament for each part (names show the colour).`;
    const dl=m.querySelector("#lbDl"); dl.innerHTML=`<button type="button" class="btn primary" data-lbdlall>Download print files (.zip)</button>`+parts.map((p,i)=>`<button type="button" class="btn" data-lbdl="${i}">${esc(p.label||p.name.replace(/^.*-/,"").replace(/\.\w+$/,""))} only</button>`).join("");
    dl.querySelector("[data-lbdlall]").onclick=()=>lbDownloadZip(MK.parts,slug+"-print-files.zip");
    dl.querySelectorAll("[data-lbdl]").forEach(b=>b.onclick=()=>lbDownloadZip([MK.parts[+b.dataset.lbdl]],MK.parts[+b.dataset.lbdl].name.replace(/\.\w+$/,"")+".zip"));
  }catch(e){ console.error("maker build",e); st.textContent="Couldn't build that: "+String(e&&e.message||e).slice(0,120)+". Try a smaller size or less detail."; }
  MK.busy=false; btn.disabled=false; }
async function lbDownloadZip(list,zipName){ try{ const files=[]; for(const p of list) files.push({name:p.name,data:new Uint8Array(await p.blob.arrayBuffer())}); files.push({name:"HOW TO PRINT.txt",data:MK.mode==="litho"?"Open the .stl in Bambu Studio. White PLA, 0.12 mm layers, 100% infill, print standing up.\r\n":"Open the .3mf in Bambu Studio and say Yes to 'load as one object with multiple parts'. Pick a filament for each part; part names show the colour. Prints face down (colours first).\r\n"});
  const z=mkZip(files); await lbDownload({name:zipName,blob:new Blob([z],{type:"application/zip"})}); }catch(e){ console.error("maker zip",e); toast("Couldn't package the files. Try again."); } }
async function lbDownload(p){ if(!p||!p.blob) return; return dlBlob(p.name,p.blob); }


// two-column layout: modes on top, picture + settings on the left, live preview on the right
lbMount();
(function(){const m=MK.node,w=m.querySelector(".lbwrap"),side=document.createElement("div");side.className="lbside";
w.insertBefore(side,m.querySelector("#lbDrop"));side.append(m.querySelector("#lbDrop"),m.querySelector(".lbopts"));})();
</script>
