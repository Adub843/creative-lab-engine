<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Maker Studio · Charleston3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>try{var t=parent.document.documentElement.dataset.theme||localStorage.getItem("bc-theme");if(t)document.documentElement.dataset.theme=String(t).replace(/"/g,"")}catch(e){}</script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="studio" id="studio">
  <header class="bar">
    <div class="bar-title">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="bar-app">Maker Studio</span>
      <span class="bar-sep" aria-hidden="true">/</span>
      <strong id="makerName">Maker</strong>
    </div>
    <div class="bar-actions">
      <button class="btn ghost" id="dlStl" type="button">STL</button>
      <button class="btn primary" id="dl3mf" type="button">Download 3MF</button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Makers"></nav>

  <main class="stage">
    <div class="view" id="view"></div>
    <div class="stage-foot">
      <span class="chip">Design preview</span>
      <span class="dims" id="dims"></span>
      <button class="icon-btn" id="fit" type="button" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="busy" id="busy" hidden>Updating</div>
  </main>

  <aside class="panel" id="panel" aria-label="Settings">
    <div id="fields"></div>
    <section class="sec checks-sec" id="checksSec">
      <h2>Print check</h2>
      <ul class="checks" id="checks"></ul>
    </section>
  </aside>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="makers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>Makers</button>
    <button type="button" data-tab="settings" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>Settings</button>
    <button type="button" data-tab="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Check</button>
    <button type="button" data-tab="download" class="tab-dl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>3MF</button>
  </nav>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script src="vendor/opentype.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="vendor/earcut.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
