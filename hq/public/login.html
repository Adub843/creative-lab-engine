<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Lab Studios</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
:root{--bg:#0e1013;--surface:#161a1f;--line:#2a3038;--fg:#e8ebef;--muted:#9ba4af;--accent:#4a92ea;--accent-strong:#2463c4;--bad:#e5675f;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--surface:#fff;--line:#e2e5e9;--fg:#11151a;--muted:#5b6470;--accent:#1f66bf;--accent-strong:#1f62b8;--bad:#b8392f;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font:17px/1.5 "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.logo{width:56px;height:56px;border-radius:16px}
h1{font-size:28px;font-weight:800;margin:0}
p{margin:0;color:var(--muted);font-size:15px}
form{width:100%;display:flex;flex-direction:column;gap:12px}
label{text-align:left;font-size:14px;font-weight:600}
input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent-strong);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.msg{min-height:22px;color:var(--bad);font-size:15px}
</style></head><body>
<main>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a9af0"/><stop offset="1" stop-color="#1f4f8f"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M13 8h6M14 8v6.2l-4.6 7.6A2 2 0 0 0 11.1 25h9.8a2 2 0 0 0 1.7-3.2L18 14.2V8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14.5" cy="20.5" r="1.3" fill="#fff"/><circle cx="18" cy="18.6" r="0.9" fill="#fff" opacity=".8"/><path d="M23.5 6.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#fff"/></svg>
  <h1>Creative Lab Studios</h1>
  <p>Sign in with the team key. This device stays signed in for 30 days.</p>
  <form id="f">
    <label for="k">Team key</label>
    <input id="k" type="password" autocomplete="current-password" required minlength="8">
    <button id="b" type="submit">Sign in</button>
    <div class="msg" id="m" role="alert"></div>
  </form>
</main>
<script>
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const b=document.getElementById("b"), m=document.getElementById("m"), k=document.getElementById("k");
  b.disabled=true; m.textContent="";
  try{ const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key:k.value})});
    if(r.ok){ location.href="/"; return; }
    m.textContent=r.status===401?"That key didn't match. Try again.":"Sign-in isn't set up yet."; }
  catch{ m.textContent="Couldn't reach the console. Check your connection."; }
  b.disabled=false; k.select();
});
</script>
</body></html>
