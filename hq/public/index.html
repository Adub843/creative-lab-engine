<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Creative Lab Studios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-card">
    <div class="lock-logo"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a9af0"/><stop offset="1" stop-color="#1f4f8f"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M13 8h6M14 8v6.2l-4.6 7.6A2 2 0 0 0 11.1 25h9.8a2 2 0 0 0 1.7-3.2L18 14.2V8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14.5" cy="20.5" r="1.3" fill="#fff"/><circle cx="18" cy="18.6" r="0.9" fill="#fff" opacity=".8"/><path d="M23.5 6.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#fff"/></svg></div>
    <h1 id="lockTitle">Creative Lab Studios</h1>
    <div class="eyebrow">Elevated Designs · Studio · Apps</div>
    <div class="who-pick" id="whoPick">
      <button type="button" data-who="Aaron" aria-pressed="false"><span class="avatar">A</span>Aaron</button>
      <button type="button" data-who="Shana" aria-pressed="false"><span class="avatar">S</span>Shana</button>
      <button type="button" data-who="Josh" aria-pressed="false"><span class="avatar">J</span>Josh</button>
    </div>
    <div class="small muted" id="lockHint">Who's signing in?</div>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <div class="lock-msg" id="lockMsg" role="alert"></div>
  </div>
</div>
<header class="top">
  <div class="top-in">
    <button type="button" class="brand" data-goto="overview" aria-label="Creative Lab Studios home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a9af0"/><stop offset="1" stop-color="#1f4f8f"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg2)"/><path d="M13 8h6M14 8v6.2l-4.6 7.6A2 2 0 0 0 11.1 25h9.8a2 2 0 0 0 1.7-3.2L18 14.2V8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14.5" cy="20.5" r="1.3" fill="#fff"/><circle cx="18" cy="18.6" r="0.9" fill="#fff" opacity=".8"/><path d="M23.5 6.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#fff"/></svg>
      <span class="brand-n">Creative Lab Studios</span>
      <span class="brand-d" id="today">—</span>
    </button>
    <button type="button" class="subjbtn" id="subjBtn" aria-controls="subjects" aria-expanded="false" aria-label="Switch subject"></button>
    <div class="hctl">
      <button class="btn searchbtn" type="button" id="cmdkBtn" aria-label="Search (Ctrl+K)"><span>Search…</span><span class="kbd">Ctrl K</span></button>
      <div class="hmenu">
        <button class="btn" type="button" id="hmenuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="hmenuPop"><span class="muted" id="whoami"></span><span aria-hidden="true">☰</span><span class="sr-only">Menu</span></button>
        <div class="hmenu-pop" id="hmenuPop" role="menu" hidden>
          <button type="button" role="menuitem" id="qaOpen" aria-controls="qa">Links &amp; notepad</button>
          <button type="button" role="menuitem" class="voicebtn" id="voiceBtn" aria-pressed="false"><span class="dot"></span><span id="voiceLabel">Stephanie's voice off</span></button>
          <button type="button" role="menuitem" class="themebtn" id="themeBtn" aria-label="Switch to light mode"><span aria-hidden="true" id="themeIcon">☀</span><span id="themeTxt">Light</span> mode</button>
          <button type="button" role="menuitem" id="pinBtn">Change PIN</button>
          <button type="button" role="menuitem" id="lockBtn">Lock</button>
          <button type="button" role="menuitem" onclick="hqSignOut()">Sign out of this device</button>
        </div>
      </div>
    </div>
  </div>
</header>
<div class="subj-scrim" id="subjScrim" aria-hidden="true"></div>
<nav class="subjects" id="subjects" aria-label="Subjects"></nav>
<main class="wrap" id="main"></main>
<div class="qa-scrim" id="qaScrim" hidden></div>
<aside class="qa" id="qa" aria-label="Links and notepad" aria-hidden="true" inert>
  <div class="qa-head"><h2>Links &amp; notepad</h2><button class="btn" id="qaClose" type="button">Close</button></div>
  <div class="qa-tabs" role="tablist"><button role="tab" data-qtab="links" aria-selected="true">Links</button><button role="tab" data-qtab="notes" aria-selected="false">Notepad</button></div>
  <div class="qa-body" id="qaBody"></div>
</aside>
<div class="dock">
  <div class="dock-in">
    <div class="ansbox" id="ansBox" hidden><div class="ans-head"><b>Stephanie</b><button class="btn" type="button" id="ansClose" aria-label="Close Stephanie's answer">Close</button></div><div class="answer" id="answer"></div></div>
    <form class="ask" id="askForm">
      <input type="text" id="askInput" placeholder="Ask Stephanie anything, or tell her what to do…" autocomplete="off" aria-label="Ask Stephanie">
      <button class="btn primary" type="submit" id="askBtn">Ask Stephanie</button>
    </form>
  </div>
</div>
<script src="cf-claude.js"></script>
<script src="js/core.js"></script>
<script src="js/company.js"></script>
<script src="js/research.js"></script>
<script src="js/design.js"></script>
<script src="js/search.js"></script>
<script src="js/maker.js"></script>
<script src="js/shops.js"></script>
<script src="js/filament.js"></script>
<script src="js/hq-plus.js"></script>
<script src="js/boot.js"></script>

</body></html>
