<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#130e1d">
<title>Chat with Alice</title>
<style>
:root{--bg:#09070d;--panel:#130e1d;--line:#2b2040;--fg:#f0ebf8;--muted:#a698bf;--me:#6a3fd0;--accent:#8b5cf6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .av{width:44px;height:44px;object-fit:cover;flex:none;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b1f7a);display:grid;place-items:center;color:#fff;font-weight:700}
header b{display:block}
header small{color:var(--muted)}
header button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
/* Alice on screen: a large portrait that breathes while idle and pulses with her voice while she speaks */
#stage{flex:none;display:grid;place-items:center;padding:18px 16px 6px;background:radial-gradient(60% 120% at 50% 0%,#24133f 0%,transparent 70%)}
#face{position:relative;width:min(44vh,340px);aspect-ratio:1;border-radius:50%}
#face video{position:absolute;inset:0;opacity:0;transition:opacity .25s}
#face.live img{opacity:0}
#face.live video.idle{opacity:1}
#face.live.talking video.idle{opacity:0}
#face.live.talking video.talk{opacity:1}
#face.live img,#face.live video{animation:none!important}
/* on a wide screen she stands beside the conversation instead of above it */
@media (min-width:980px){
 body{display:grid;grid-template-columns:minmax(360px,42%) 1fr;grid-template-rows:auto 1fr auto}
 header{grid-column:1/-1}
 #stage{grid-column:1;grid-row:2/4;align-content:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,#2a1650 0%,transparent 75%);border-right:1px solid var(--line)}
 #face{width:min(34vw,62vh,520px)}
 #log{grid-column:2;grid-row:2;max-width:none;min-height:0}
 form{grid-column:2;grid-row:3;max-width:none}
}
#face img,#face video{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:2px solid #3a2a5c;animation:breathe 6s ease-in-out infinite}
#face::before,#face::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
#face.talking img,#face.talking video{border-color:var(--accent);animation:speak .42s ease-in-out infinite alternate}
#face.talking::before{animation:ring 1.4s ease-out infinite}
#face.talking::after{animation:ring 1.4s ease-out .7s infinite}
#face.thinking img,#face.thinking video{filter:saturate(.7) brightness(.85)}
#stage small{margin-top:10px;color:var(--muted);min-height:1.4em}
@keyframes breathe{50%{transform:scale(1.015)}}
@keyframes speak{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.28)}}
@media (max-height:620px){#face{width:110px}}
@media (prefers-reduced-motion:reduce){#face img,#face video,#face::before,#face::after{animation:none!important}}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.a{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.u{background:var(--me);color:#fff;align-self:flex-end}
.e{color:#e5484d;align-self:center;font-size:14px}
.t{color:var(--muted);font-style:italic}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;min-height:44px;max-height:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
form button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5}
#mic{flex:none;width:48px;padding:0;display:grid;place-items:center;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
#mic svg{width:22px;height:22px}
#mic.on{background:#d93025;border-color:#d93025;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
#voice.on{border-color:var(--accent);color:var(--accent)}
@media (max-width:480px){header small{display:none}}

/* When the conversation needs the room, Alice shrinks up into the top bar (tap her small picture to bring her back). */
#stage{transition:max-height .3s ease,padding .3s ease,opacity .25s ease;max-height:70vh;overflow:hidden}
@media (max-width:979px){
 body.compact #stage{max-height:0;padding-top:0;padding-bottom:0}
 body.compact #face,body.compact #mood{opacity:0;transition:opacity .2s}
 body.compact header .av{width:52px;height:52px;border:2px solid #3a2a5c;transition:border-color .2s,box-shadow .2s;cursor:pointer}
 body.compact.speaking header .av{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.25)}
}

/* Quick actions: beside Alice on a computer, behind the Menu button on a phone. */
#acts{display:grid;gap:8px;width:min(100%,420px);margin-top:16px}
#acts button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;text-align:left;cursor:pointer}
#acts button:hover{border-color:var(--accent)}
#acts button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#menu{display:none}
@media (min-width:980px){#voice{margin-left:auto!important} #acts{grid-template-columns:1fr 1fr} #stage{max-height:none;overflow-y:auto;align-content:safe center} #face{width:min(30vw,42vh,460px)}}
@media (max-width:979px){
 #menu{display:inline-block}
 #acts{display:none;position:fixed;z-index:5;top:64px;right:10px;left:10px;width:auto;margin:0;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
 body.menu-open #acts{display:grid}
 header button{padding:6px 8px;font-size:13px}
}
</style>
</head>
<body>
<header><img class="av" src="/avatar.png" alt="Alice"><div><b>Alice</b><small id="st">Local Qwen on the Blink · private to your tailnet</small></div><button id="menu" type="button" aria-expanded="false" aria-controls="acts">Menu</button><button id="voice" type="button" aria-pressed="false" style="margin-left:0">Voice off</button><button id="new" type="button" style="margin-left:0">New chat</button></header>
<div id="stage"><div id="face"><img src="/avatar.png" alt="Alice"><video class="idle" src="/alice-idle.mp4" muted loop playsinline preload="auto" poster="/avatar.png" aria-hidden="true"></video><video class="talk" src="/alice-talk.mp4" muted loop playsinline preload="auto" poster="/avatar.png" aria-hidden="true"></video></div><small id="mood">Here with you.</small><div id="acts" role="group" aria-label="Quick actions"><button type="button" data-send="What do you remember about me?">What you remember<small>The things I asked you to keep</small></button><button type="button" data-notes="1">Notes and tasks<small>What I have saved with you</small></button><button type="button" data-fill="Remember that ">Remember something<small>Saved for good</small></button><button type="button" data-fill="Find ">Look something up<small>Searches the web, with links</small></button><button type="button" data-fill="Tell the team: ">Tell the team<small>A note Steve will also see</small></button><button type="button" data-send="What is on my calendar today and tomorrow?">My calendar<small>Today and tomorrow</small></button><button type="button" data-send="Any important new email I should know about?">My mail<small>Anything that needs me</small></button><button type="button" data-go="/talk">Notes mode<small>Talk page: saves notes, does tasks</small></button></div></div>
<div id="log" aria-live="polite"></div>
<form id="f"><button id="mic" type="button" aria-label="Talk to Alice" title="Talk to Alice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button><textarea id="q" placeholder="Message Alice…" rows="1" aria-label="Message Alice"></textarea><button id="go">Send</button></form>
<script>
let LIVE=false;
function face(state,text){const f=document.getElementById('face');f.className=(LIVE?'live ':'')+state;document.getElementById('mood').textContent=text;const t=f.querySelector('video.talk');if(LIVE&&t){if(state==='talking'){t.currentTime=0;t.play().catch(()=>{})}else t.pause()}}
// The clips are optional: if they load she is shown living and moving, and if not the photo stays.
addEventListener('DOMContentLoaded',()=>{const i=document.querySelector('#face video.idle');if(!i)return;i.addEventListener('playing',()=>{LIVE=true;face('',document.getElementById('mood').textContent)},{once:true});i.play().catch(()=>{})});
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
const KEY='alice-web-chat';
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!st||!st.session) st=fresh();
function fresh(){return {session:Math.random().toString(36).slice(2,12)+Date.now().toString(36),msgs:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch{}}
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d}
function paint(){log.textContent='';if(!st.msgs.length) add('a',"Hi Aaron, it's Alice. What are we working on?");st.msgs.forEach(m=>add(m.r==='u'?'u':'a',m.t))}
paint();
document.getElementById('new').onclick=()=>{st=fresh();save();paint();q.focus()};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'});
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const text=q.value.trim();if(!text||go.disabled) return;
  q.value='';q.style.height='auto';st.msgs.push({r:'u',t:text});save();add('u',text);
  const wait=add('a t','Alice is thinking…');go.disabled=true;face('thinking','Thinking…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session:st.session})});
    const j=await r.json();wait.remove();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    st.msgs.push({r:'a',t:j.reply});save();add('a',j.reply);face('','Here with you.');speak(j.reply);
  }catch(err){wait.remove();face('','Here with you.');add('e',"Couldn't reach Alice: "+err.message)}
  go.disabled=false;q.focus();
};

// Voice: tap the microphone, speak, tap again to send. Replies are read aloud when Voice is on.
const mic=document.getElementById('mic'),vbtn=document.getElementById('voice'),sub=document.getElementById('st'),SUB=sub.textContent;
let voiceOn=false;try{voiceOn=localStorage.getItem('alice-web-voice')==='1'}catch{}
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));VOICE=vs.find(v=>/samantha|female|zira|jenny|aria|google us english/i.test(v.name))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else{vbtn.hidden=true}
function paintVoice(){vbtn.textContent=voiceOn?'Voice on':'Voice off';vbtn.classList.toggle('on',voiceOn);vbtn.setAttribute('aria-pressed',voiceOn)}
function speak(t){if(!voiceOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[*_#`>]/g,'').slice(0,1200));if(VOICE)u.voice=VOICE;u.rate=1.2;u.onstart=()=>face('talking','Talking…');u.onend=u.onerror=()=>face('','Here with you.');speechSynthesis.speak(u)}
vbtn.onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('alice-web-voice',voiceOn?'1':'0')}catch{};paintVoice();if(voiceOn)speak('Voice is on.');else if('speechSynthesis' in window)speechSynthesis.cancel()};
paintVoice();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,base='',autoSend=false;
if(!SR){mic.onclick=()=>{q.focus();sub.textContent='This browser has no built-in listening. Tap the microphone on your keyboard to talk.'}}
else mic.onclick=()=>{
  if(listening){autoSend=true;rec.stop();return}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;base=q.value?q.value.trim()+' ':'';autoSend=false;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;q.value=base+t;q.dispatchEvent(new Event('input'))};
  rec.onerror=e=>{sub.textContent=e.error==='not-allowed'?'Microphone blocked: allow it for this page in the browser, or use the keyboard microphone.':'Microphone: '+e.error};
  rec.onend=()=>{listening=false;mic.classList.remove('on');mic.setAttribute('aria-label','Talk to Alice');if(sub.textContent.startsWith('Listening'))sub.textContent=SUB;if(autoSend&&q.value.trim())document.getElementById('f').requestSubmit()};
  try{rec.start();listening=true;mic.classList.add('on');mic.setAttribute('aria-label','Stop and send');sub.textContent='Listening. Tap the microphone again to send.'}catch(err){sub.textContent='Microphone: '+err.message}
};
q.focus();

// Alice shrinks into the top bar once the messages fill the screen or you scroll; she comes back at the top of an empty chat.
(function(){
  const logEl=document.getElementById('log'),stage=document.getElementById('stage'),head=document.querySelector('header .av');
  if(!logEl||!stage)return;
  let pinnedOpen=false;
  function fit(){
    if(pinnedOpen)return;
    // Once the chat has a few messages she moves up and stays up, so the page never flips back and forth.
    const busy=logEl.querySelectorAll('.m').length>=3;
    if(busy||logEl.scrollTop>8)document.body.classList.add('compact');
    else if(!busy&&logEl.scrollTop<=8&&logEl.scrollHeight<=logEl.clientHeight+8)document.body.classList.remove('compact');
  }
  logEl.addEventListener('scroll',()=>{if(logEl.scrollTop>8){pinnedOpen=false;fit()}},{passive:true});
  new MutationObserver(()=>{pinnedOpen=false;fit()}).observe(logEl,{childList:true});
  addEventListener('resize',fit);
  if(head)head.addEventListener('click',()=>{pinnedOpen=document.body.classList.contains('compact');document.body.classList.toggle('compact',!pinnedOpen)});
  if('speechSynthesis' in window)setInterval(()=>document.body.classList.toggle('speaking',speechSynthesis.speaking),300);
  fit();
})();

// Quick actions: send a ready question, start a sentence for you to finish, or show saved notes and tasks.
(function(){
  const acts=document.getElementById('acts'),menu=document.getElementById('menu'),box=document.getElementById('q'),form=document.getElementById('f');
  if(!acts)return;
  const close=()=>{document.body.classList.remove('menu-open');if(menu)menu.setAttribute('aria-expanded','false')};
  if(menu)menu.onclick=()=>{const o=document.body.classList.toggle('menu-open');menu.setAttribute('aria-expanded',o)};
  acts.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;close();
    if(b.dataset.go){location.href=b.dataset.go;return}
    if(b.dataset.fill){box.value=b.dataset.fill;box.focus();box.setSelectionRange(box.value.length,box.value.length);return}
    if(b.dataset.send){box.value=b.dataset.send;form.requestSubmit();return}
    if(b.dataset.notes){
      try{const r=await fetch('/api/log');const j=await r.json();const rows=(j.entries||[]).slice(0,15);
        add('a',rows.length?'Your latest notes and tasks:\n'+rows.map(x=>'- '+(x.kind==='task'?'Task: ':'Note: ')+(x.title||x.said||'')).join('\n'):'You have no saved notes or tasks yet. Use Notes mode to add some.');
      }catch(err){add('e',"Couldn't load your notes: "+err.message)}
    }
  });
  document.addEventListener('click',e=>{if(!e.target.closest('#acts')&&!e.target.closest('#menu'))close()});
})();
</script>
</body>
</html>
