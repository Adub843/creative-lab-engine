<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Documents</title>
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#15223f">
<style>
:root{--navy:#15223f;--ink:#1f2638;--muted:#4d5568;--cream:#f7f2e8;--paper:#fffdf8;--line:#e2d9c6;--gold:#b8892a;--btn:#7a5f22;--teal:#17786f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--navy);color:var(--cream);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
header .count{color:#c9cfdd;font-size:14px}
.search{margin-left:auto;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #47557a;background:#1d2d52;color:var(--cream);font:inherit}
.search input::placeholder{color:#b9c1d4}
.search input:focus{outline:2px solid var(--gold);outline-offset:1px}
.wrap{flex:1;min-height:0;display:flex}
nav{width:270px;flex:none;background:var(--paper);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
nav button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:44px}
nav button:hover{background:#f1e9d8}
nav button[aria-current=true]{background:var(--navy);color:var(--cream)}
nav button span.n{margin-left:auto;font-size:13px;color:var(--muted)}
nav button[aria-current=true] span.n{color:#c9cfdd}
main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 40px}
main h2{margin:0 0 4px;font-size:24px;font-weight:600;color:var(--navy)}
main p.about{margin:0 0 18px;color:var(--muted)}
h3{margin:22px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--btn);font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
a.doc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;min-height:64px}
a.doc:hover{border-color:var(--gold);box-shadow:0 1px 0 var(--gold)}
a.doc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.badge{flex:none;min-width:52px;text-align:center;font-size:12px;font-weight:600;padding:4px 6px;border-radius:6px;background:#efe7d6;color:#5b4718}
.badge.PDF{background:#f3dcd6;color:#7c2a17}.badge.Excel,.badge.Sheet{background:#dcebdc;color:#1f5a2a}.badge.Word{background:#dbe5f3;color:#1d4079}
.badge.Link{background:#d9eeeb;color:#125e56}.badge.Page{background:#e6e0f1;color:#473179}
.doc b{display:block;font-weight:600;overflow-wrap:anywhere}
.doc small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:30px 0}
@media (max-width:760px){
  .wrap{flex-direction:column}
  nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
  nav button{width:auto;white-space:nowrap;border:1px solid var(--line)}
  nav button span.n{margin-left:6px}
  main{padding:16px 14px 40px}
  .list{grid-template-columns:1fr}
  .search{flex-basis:100%;max-width:none;margin-left:0}
}
</style>
</head>
<body>
<header>
<h1>Documents</h1>
<span class="count" id="count"></span>
<label class="search"><span style="position:absolute;left:-9999px">Search documents</span><input id="q" type="search" placeholder="Search every document" autocomplete="off"></label>
</header>
<div class="wrap">
<nav id="cats" aria-label="Categories"></nav>
<main id="main" aria-live="polite"><p class="empty">Loading your documents.</p></main>
</div>
<script>
const $=id=>document.getElementById(id);
let DATA={categories:[],docs:[]},CAT='Start here';
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
const when=d=>{const [y,m,day]=d.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+Number(day)+', '+y};
function href(d){return d.url?d.url:(['md','txt','csv'].includes(d.ext)?'/view?id=':'/file?id=')+d.id}
function card(d,showCat){return `<a class="doc" href="${esc(href(d))}" target="_blank" rel="noopener"><span class="badge ${esc(d.type)}">${esc(d.type)}</span><span><b>${esc(d.title)}</b><small>${showCat?esc(d.category)+' · ':''}${d.url?'opens the link':'updated '+when(d.modified)}</small></span></a>`}
function paintCats(){
  $('cats').innerHTML=DATA.categories.map(c=>{const n=DATA.docs.filter(d=>d.category===c.name).length;
    return n?`<button type="button" data-c="${esc(c.name)}" aria-current="${c.name===CAT}">${esc(c.name)}<span class="n">${n}</span></button>`:''}).join('');
  $('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{CAT=b.dataset.c;$('q').value='';paint()});
}
function paint(){
  paintCats();
  const q=$('q').value.trim().toLowerCase(),m=$('main');
  if(q){
    const words=q.split(/\s+/);
    const hits=DATA.docs.filter(d=>{const t=(d.title+' '+d.category+' '+d.group+' '+d.type).toLowerCase();return words.every(w=>t.includes(w))});
    m.innerHTML=`<h2>Search</h2><p class="about">${hits.length} document${hits.length===1?'':'s'} match "${esc(q)}"</p>`+(hits.length?`<div class="list">${hits.slice(0,200).map(d=>card(d,true)).join('')}</div>`:'<p class="empty">Nothing matches. Try one word from the name.</p>');
    return;
  }
  const c=DATA.categories.find(x=>x.name===CAT)||{name:CAT,about:''};
  const docs=DATA.docs.filter(d=>d.category===CAT);
  const groups=[...new Set(docs.map(d=>d.group))];
  m.innerHTML=`<h2>${esc(c.name)}</h2><p class="about">${esc(c.about)}</p>`+groups.map(g=>(g?`<h3>${esc(g)}</h3>`:'')+`<div class="list">${docs.filter(d=>d.group===g).map(d=>card(d,false)).join('')}</div>`).join('');
  m.scrollTop=0;
}
$('q').addEventListener('input',paint);
fetch('/api/docs').then(r=>r.json()).then(j=>{DATA=j;$('count').textContent=j.docs.length+' documents';paint()})
  .catch(()=>{$('main').innerHTML='<p class="empty">The documents list could not be loaded. Check that the NUC is on.</p>'});
</script>
</body>
</html>
