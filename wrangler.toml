# Creative Lab engine on Cloudflare Workers (free plan): the background engine behind the Creative Lab Studios
# console (https://claude.ai/artifact/U8rNeWMPq7NfF7f88AEuPK). It has no pages of its own: the console sends its
# actions through the ACTIONS queue (worker/queue.mjs), and the shirt apps keep reading /api/images?public=1.
# Secrets (Shopify tokens, CONSOLE_KEY, ...) are never written here: set them with `npx wrangler secret put NAME`.
# See the README, "Put the console online (Cloudflare)".
name = "creative-lab-engine"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"
# lib/shopify.mjs checks the console key with node:crypto (createHash, timingSafeEqual).
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Keep variables added in the Cloudflare dashboard (IndexNow and Bing keys) when deploying.
keep_vars = true

# Copies index.html and assets/ into dist/ before `wrangler dev` and `wrangler deploy`.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request goes through the Worker first, so the API routes win and every page gets the
# security headers set in worker/app.mjs.
run_worker_first = true

# The image library (Workers KV: each image's bytes plus its name, type, size and tags).
# No id is needed: the first `wrangler deploy` creates the namespace on your account and later
# deploys keep using it. `wrangler dev` keeps a separate local copy on your computer.
[[kv_namespaces]]
binding = "IMAGES"
# The same namespace the old business console used, shared with the Design Studio (epix3d.com). Never delete it.
id = "a4c25d0fee6e45448ada053a44b19bcc"


# Charleston 3D's print files (lib/r2-store.mjs). R2 has room for the whole print library; KV holds
# about 1 GB and is shared with the Elevated Designs images. Create the bucket once before the first
# deploy with it: npx wrangler r2 bucket create c3d-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "c3d-files"

# Where the shirt price sync got to (lib/pricing.mjs). Created on the first deploy like IMAGES.
[[kv_namespaces]]
binding = "PRICING"
id = "279045cf3fe54a76a6a0549b2cc6a901"

# Each store's daily marketing scores (lib/marketing.mjs), kept for 120 days. Created by the first
# deploy like IMAGES.
[[kv_namespaces]]
binding = "MARKETING"
id = "d4076444457f4565a57fb1cdb6071c7b"

# The console's actions in, their answers out (worker/queue.mjs). Created once with
#   npx wrangler queues create creative-lab-actions
#   npx wrangler r2 bucket create creative-lab-engine
[[r2_buckets]]
binding = "RESULTS"
bucket_name = "creative-lab-engine"

[[queues.consumers]]
queue = "creative-lab-actions"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 0

[vars]
CONSOLE_PAGE = "https://claude.ai/artifact/U8rNeWMPq7NfF7f88AEuPK"

# 11:00 UTC daily (early morning in Charleston): checks both public sites for the Marketing page.
# 11:30 UTC daily: applies the safe SEO fixes (titles, descriptions, alt text) to both stores.
# Every 15 minutes: moves the shirt price sync one step on; a new sync only starts when the price
# sheet changed or the last one is over a day old.
# Hourly at :45: the image library follows the Kittl library (lib/kittl-sync.mjs).
[triggers]
# OFF until the switch-over: the old business-console Worker still runs these, and the free plan allows 5 crons
# per account. At the switch-over the old Worker's crons are removed and this line becomes:
# crons = ["0 11 * * *", "30 11 * * *", "*/15 * * * *", "45 * * * *"]
crons = []
