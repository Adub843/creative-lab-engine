# The Lab on the Synology DS225+ (Container Manager > Project > Create, path /volume1/lab/app/lab-app/deploy/synology).
# Folders on the Synology (made in step 2 of SYNOLOGY.md):
#   /volume1/lab/app     the creative-lab-engine code (lab-app/ and the Lab's page files in lab/)
#   /volume1/lab/data    database, sign-ins, Stacy's run logs, hourly copies
#   /volume1/lab/files   everything uploaded in the Lab (no size cap but the disks)
#   /volume1/lab/config  lab.config.json and lab.env (secrets, typed by Aaron)
#   /volume1/lab/libraries/{video,3d,art}  the big libraries
# It listens on 127.0.0.1:3000 only; Tailscale on the Synology serves it over HTTPS to signed-in devices.
services:
  lab:
    image: node:22-bookworm-slim
    container_name: lab
    restart: unless-stopped
    network_mode: host
    working_dir: /app/lab-app
    env_file: /volume1/lab/config/lab.env
    environment:
      LAB_CONFIG: /etc/lab/lab.config.json
      NODE_ENV: production
    command: sh -c "npm ci --omit=dev --no-audit --no-fund && exec node server/index.mjs"
    volumes:
      - /volume1/lab/app:/app
      - /volume1/lab/data:/srv/lab/data
      - /volume1/lab/files:/srv/lab/files
      - /volume1/lab/config:/etc/lab:ro
      # big libraries (videos, 3D, art), read-only: one subfolder per entry in lab.config.json "libraries"
      - /volume1/lab/libraries:/srv/lib:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/_lab/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
  backup:
    image: node:22-bookworm-slim
    container_name: lab-backup
    restart: unless-stopped
    working_dir: /app/lab-app
    environment:
      LAB_CONFIG: /etc/lab/lab.config.json
    command: sh -c "while true; do node server/admin.mjs backup /srv/lab/data/backups; sleep 3600; done"
    volumes:
      - /volume1/lab/app:/app:ro
      - /volume1/lab/data:/srv/lab/data
      - /volume1/lab/config:/etc/lab:ro
